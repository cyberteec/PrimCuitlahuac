<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Escolar - Primaria Cuitláhuac</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }
    body {
      background: linear-gradient(145deg, #e9eff5, #cbd7e3);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 30px 22px;
      box-shadow: 0 10px 25px rgba(15, 43, 72, 0.12);
      text-align: center;
      border-top: 6px solid #0f2b48; /* Azul marino institucional */
    }
    .logo-container {
      margin-bottom: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .school-logo {
      max-width: 95px;
      max-height: 95px;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
    }
    .badge {
      display: inline-block;
      background: #edf3f8;
      color: #0f2b48;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 50px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      border: 1px solid #d0dfec;
    }
    h1 {
      font-size: 1.35rem;
      color: #0a1b2e;
      margin-bottom: 5px;
      line-height: 1.3;
    }
    p.subtitle {
      font-size: 0.92rem;
      color: #556c82;
      margin-bottom: 22px;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 18px;
      font-size: 0.98rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
    }
    /* Botón Ubicación: Azul marino profundo */
    .btn-ubicacion {
      background-color: #0f2b48;
      color: #ffffff;
    }
    .btn-ubicacion:hover {
      background-color: #091a2d;
      transform: translateY(-2px);
    }
    /* Botón Carta: Azul marino medio / más bajo */
    .btn-carta {
      background-color: #214d7a;
      color: #ffffff;
    }
    .btn-carta:hover {
      background-color: #173757;
      transform: translateY(-2px);
    }
    .info-box {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px dashed #c2d2e1;
      text-align: center;
      font-size: 0.84rem;
      color: #435b71;
      line-height: 1.5;
    }
    .info-box strong {
      color: #0f2b48;
    }
    .icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
      flex-shrink: 0;
    }
    footer {
      margin-top: 20px;
      font-size: 0.74rem;
      color: #8397aa;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Logotipo Institucional de la Escuela -->
    <div class="logo-container">
      <img src="logo.jpg" alt="Logotipo Escuela Primaria Cuitláhuac" class="school-logo">
    </div>

    <div class="badge">C.C.T. 15EPR4400V</div>
    <h1>Escuela Primaria<br>“Cuitláhuac”</h1>
    <p class="subtitle">Turno Vespertino | Portal de Enlaces Rápidos</p>

    <div class="btn-container">
      <!-- Botón Ubicación -->
      <a class="btn btn-ubicacion" 
         href="https://www.google.com/maps/search/?api=1&query=Escuela+Primaria+Cuitlahuac+Zafiro+esquina+Acerina+Colonia+La+Joya+Ecatepec+de+Morelos" 
         target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        Ver Ubicación en Maps
      </a>

      <!-- Botón Carta de Corresponsabilidad -->
      <a class="btn btn-carta" 
         href="CARTA_DE_CORRESPONSABILIDAD_CUITLAHUAC.pdf" 
         target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        Carta de Corresponsabilidad (PDF)
      </a>
    </div>

    <!-- Dirección del plantel -->
    <div class="info-box">
      <strong>Dirección del Plantel:</strong><br>
      Zafiro esquina Acerina s/n, Colonia La Joya, Ecatepec de Morelos, Estado de México.
    </div>

    <footer>
      Comunidad Escolar • Convivencia Armónica
    </footer>
  </div>

</body>
</html>
